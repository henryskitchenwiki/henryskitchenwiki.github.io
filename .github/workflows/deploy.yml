# Runs on every merge to main (and from the Actions tab with "Run workflow"):
# builds the site and publishes it to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a publish halfway; if two merges land close together, they queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run the tests
        run: dotnet test tests/HenrysKitchen.Tests --configuration Release

      - name: Build the site
        run: dotnet run --project src/HenrysKitchen.Build --configuration Release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
